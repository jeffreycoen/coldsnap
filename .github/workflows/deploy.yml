name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The kept gate set (C0 purge, mk0.31 — docs/superpowers/test-manifest.md).
      # The boot-load smoke (npm run smoke) needs a live preview server and a
      # browser: it runs locally, not here. Measuring tools (diag-/-probe/
      # measure-) never run in the pipeline.
      - run: npm run golden
      - run: npm run lint:depot
      - run: npm run test:predicate
      - run: npm run test:scenario
      - run: npm run test:combat
      - run: npm run test:depot
      - run: npm run test:accuracy
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
